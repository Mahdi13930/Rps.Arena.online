name = "rps-arena-online3"
main = "src/index.js"
compatibility_date = "2026-11-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RPSRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RPSRoom"]
